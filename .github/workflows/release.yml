name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Explicit tag to release (overrides auto-derivation)"
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build OpenBSD arm64 package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    outputs:
      tag: ${{ steps.determine-tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release tag
        id: determine-tag
        env:
          OVERRIDE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            # Tag push: the tag *is* the release tag.
            TAG="${GITHUB_REF_NAME}"
            echo "Using pushed tag: $TAG"
          elif [ -n "${OVERRIDE_TAG}" ]; then
            TAG="${OVERRIDE_TAG#refs/tags/}"
            echo "Using override tag: $TAG"
          else
            # workflow_dispatch with no tag: derive the next rc from the
            # highest vX.Y.Z stable tag. (v4.0.1 -> v4.1.0rc1)
            LAST=$(git tag --list 'v*' --sort=-version:refname \
              | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ {print; exit}')
            if [ -z "${LAST}" ]; then
              echo "FATAL: no vX.Y.Z stable tags found in this repository." >&2
              exit 1
            fi
            echo "Last stable tag: $LAST"
            V="${LAST#v}"
            MAJOR="${V%%.*}"
            REST="${V#*.}"
            MINOR="${REST%%.*}"
            NEXT_MINOR=$((MINOR + 1))
            BASE="v${MAJOR}.${NEXT_MINOR}.0rc"
            RC_TAGS=$(git tag --list "${BASE}*" --sort=-version:refname)
            if [ -z "${RC_TAGS}" ]; then
              TAG="${BASE}1"
            else
              HIGHEST_RC=$(echo "${RC_TAGS}" | head -n1)
              N="${HIGHEST_RC#*rc}"
              if ! [[ "${N}" =~ ^[0-9]+$ ]]; then
                echo "FATAL: could not parse rc number from '${HIGHEST_RC}'." >&2
                exit 1
              fi
              TAG="${BASE}$((N + 1))"
              echo "Existing rc series: ${RC_TAGS// /, }"
            fi
            echo "Using auto-derived tag: $TAG"
          fi
          # Expose to the publish job via the job output + as a file
          # in the artifact (so the publish job can cross-check it).
          mkdir -p dist
          printf '%s\n' "${TAG}" > dist/RELEASE_TAG
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "RELEASE_TAG=${TAG}"

      - name: Start OpenBSD arm64 VM
        uses: cross-platform-actions/action@v1.4.0
        with:
          operating_system: openbsd
          architecture: arm64
          version: "7.9"
          shell: bash
          memory: 5G
          cpu_count: 4

      - name: Install Rust toolchain (native)
        shell: bash
        run: |
          set -euo pipefail
          if command -v cargo >/dev/null 2>&1; then
            cargo --version
            exit 0
          fi
          pkg_add -u cargo
          cargo --version

      - name: Build release binaries (receiver with arduino)
        shell: bash
        run: |
          set -euo pipefail
          # NOTE: do NOT `rm -rf dist` here - dist/RELEASE_TAG was
          # written by the previous step (on the GitHub host, before
          # the VM started) and needs to survive to the artifact.
          rm -rf dist/package-stage
          cargo build --release --package diode-receive --features arduino
          cargo build --release --package diode-send
          ls -lh target/release/diode_send target/release/diode_receive

          # Stage bare binaries for the GitHub release.
          mkdir -p dist
          cp target/release/diode_send    dist/diode_send
          cp target/release/diode_receive dist/diode_receive
          chmod 0755 dist/diode_send dist/diode_receive

          ( cd dist && ../target/release/diode_sha256 diode_send diode_receive | tee SHA256SUMS_binaries )

      - name: Build OpenBSD package (tar + gzip)
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(cat dist/RELEASE_TAG)"
          VERSION="${TAG#v}"
          # 4.0.2      -> version=4.0.2, rev=""
          # 4.0.2rc3   -> version=4.0.2, rev=rc3
          if [[ "${VERSION}" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(rc[0-9]+)?$ ]]; then
            BASE_VERSION="${BASH_REMATCH[1]}"
            REV="${BASH_REMATCH[2]}"
          else
            BASE_VERSION="${VERSION}"
            REV=""
          fi
          PKG_NAME="diode-${BASE_VERSION}${REV:+-${REV}}"
          echo "PACKAGING ${PKG_NAME}"

          # The OpenBSD package format (package(5)) is a tar+gzip archive
          # whose *first* entry is the packing-list ($PKG_NAME+CONTENTS)
          # and whose *second* entry is the metadata ($PKG_NAME+COMMENT).
          # pkg_add(1) reads those two first, then extracts the rest of
          # the archive (the payload) into the destination. The
          # cross-platform OpenBSD image we build on does not ship
          # pkg_create, so we assemble the archive with tar(1) + gzip(1)
          # and emit the +CONTENTS / +COMMENT entries ourselves.
          #
          # The result is an *unsigned* package; the end-user installs
          # it with `pkg_add -D unsigned <file.tgz>` (or via
          # TRUSTED_PKG_PATH).
          STAGE=dist/package-stage
          rm -rf "$STAGE"
          mkdir -p \
            "$STAGE/usr/local/bin" \
            "$STAGE/usr/local/etc/rc.d" \
            "$STAGE/usr/local/usr/local/share/doc/diode"

          cp target/release/diode_send    "$STAGE/usr/local/bin/diode_send"
          cp target/release/diode_receive "$STAGE/usr/local/bin/diode_receive"
          cp etc/rc.d/diode_send          "$STAGE/usr/local/etc/rc.d/diode_send"
          cp etc/rc.d/diode_receive       "$STAGE/usr/local/etc/rc.d/diode_receive"
          cp README.md  "$STAGE/usr/local/usr/local/share/doc/diode/README.md"
          cp LICENSE    "$STAGE/usr/local/usr/local/share/doc/diode/LICENSE"
          chmod 0755 "$STAGE/usr/local/bin/diode_send" \
                    "$STAGE/usr/local/bin/diode_receive"
          chmod 0644 "$STAGE/usr/local/etc/rc.d/diode_send" \
                    "$STAGE/usr/local/etc/rc.d/diode_receive" \
                    "$STAGE/usr/local/usr/local/share/doc/diode/README.md" \
                    "$STAGE/usr/local/usr/local/share/doc/diode/LICENSE"

          # +COMMENT: metadata shown by pkg_info. Multiple COMMENT=
          # entries are allowed; the first is the short description.
          {
            echo "COMMENT=File-transfer data diode (sender + receiver) for OpenBSD arm64."
            echo "COMMENT=Installs diode_send and diode_receive plus matching rc.d scripts."
            echo "MAINTAINER=${MAINTAINER:-svenseeberg@users.noreply.github.com}"
          } > "$STAGE/${PKG_NAME}+COMMENT"

          # +CONTENTS: one line per file/directory in the payload,
          # relative to the archive root (which pkg_add treats as the
          # target prefix /). Directories end with a trailing slash.
          ( cd "$STAGE" && \
            { find . -mindepth 1 -maxdepth 8 -type d | sed 's|^\./||; s|$|/|'
              find . -mindepth 1 -maxdepth 8 -type f | sed 's|^\./||'
            } | LC_ALL=C sort \
              | grep -vE "^\+?$|^${PKG_NAME}\+" ) \
            > "$STAGE/${PKG_NAME}+CONTENTS"
          echo "--- +CONTENTS ---"
          cat "$STAGE/${PKG_NAME}+CONTENTS"
          echo "--- +COMMENT ---"
          cat "$STAGE/${PKG_NAME}+COMMENT"

          # Build the tgz. The two meta entries MUST be the first members
          # in the archive (package(5)).
          ( cd "$STAGE" && \
            tar -c \
              "${PKG_NAME}+CONTENTS" \
              "${PKG_NAME}+COMMENT" \
              usr \
            | gzip -9 > "../${PKG_NAME}.tgz" )
          mv -f "dist/${PKG_NAME}.tgz" "dist/diode-$VERSION.tgz"

          ls -lh dist/
          echo "--- archive listing ---"
          tar -tzf "dist/diode-$VERSION.tgz"
          ( cd dist && ../target/release/diode_sha256 diode-$VERSION.tgz | tee diode-$VERSION.tgz.sha256 )

      - name: Sync VM files back to the runner
        run: cpa.sh --sync-files vm-to-runner

      - name: Finalize artifact directory
        run: |
          set -euo pipefail
          TAG="$(tr -d '[:space:]' < dist/RELEASE_TAG)"
          VERSION="${TAG#v}"
          # Drop the scratch staging dir before it lands in the artifact.
          rm -rf dist/package-stage
          # Aggregate sha256 manifest for the whole asset set (host-side,
          # so we don't depend on the VM's diode_sha256 binary).
          ( cd dist && \
            ls -lh && \
            sha256sum diode_send diode_receive "diode-$VERSION.tgz" "diode-$VERSION.tgz.sha256" RELEASE_TAG \
              | tee SHA256SUMS )
          # Hard-fail if a required release file is missing.
          for f in \
            dist/diode_send \
            dist/diode_receive \
            "dist/diode-$VERSION.tgz" \
            "dist/diode-$VERSION.tgz.sha256" \
            dist/RELEASE_TAG; do
            if [ ! -s "$f" ]; then
              echo "FATAL: required file missing or empty: $f" >&2
              exit 1
            fi
          done

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/
          retention-days: 7

  publish:
    name: Create GitHub release
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ needs.build.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist/

      - name: Verify tag state
        run: |
          set -euo pipefail
          if [ -z "${TAG}" ]; then
            echo "FATAL: TAG is empty (job output from build did not propagate)." >&2
            exit 1
          fi
          echo "Publishing release for tag: ${TAG}"
          # Cross-check the file in the artifact against the job output.
          if [ ! -s dist/RELEASE_TAG ]; then
            echo "FATAL: dist/RELEASE_TAG is missing in the release artifact." >&2
            exit 1
          fi
          FILE_TAG="$(tr -d '[:space:]' < dist/RELEASE_TAG)"
          if [ "${FILE_TAG}" != "${TAG}" ]; then
            echo "FATAL: artifact tag '${FILE_TAG}' != job output '${TAG}'." >&2
            exit 1
          fi
          # Confirm the tag exists on the remote. Read-only query only -
          # this workflow does not (by policy) create or push tags.
          REMOTE="https://github.com/${{ github.repository }}.git"
          if ! git ls-remote --exit-code --tags "${REMOTE}" "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "FAILED: tag ${TAG} is not present on the remote." >&2
            echo "       This workflow does not create or push tags." >&2
            echo "       Push the tag to github.com and re-trigger." >&2
            exit 1
          fi

      - name: Create or update the GitHub release
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PRERELEASE=""
          [[ "${VERSION}" == *rc* ]] && PRERELEASE="--prerelease"

          {
            echo "OpenBSD arm64 package for the data diode (sender + receiver)."
            echo ""
            if [[ "${VERSION}" == *rc* ]]; then
              echo "_This is a **release candidate** (rc) on the way to the next stable release. Feedback is welcome._"
              echo ""
            fi
            echo "## Install"
            echo ""
            echo "The package is unsigned, so install it with:"
            echo ""
            echo "~~~"
            echo "fetch -o /tmp/diode.tgz https://github.com/${{ github.repository }}/releases/download/$TAG/diode-$VERSION.tgz"
            echo "pkg_add -D unsigned /tmp/diode.tgz"
            echo "~~~"
            echo ""
            echo "Or in one step from a URL:"
            echo ""
            echo "~~~"
            echo "pkg_add -D unsigned https://github.com/${{ github.repository }}/releases/download/$TAG/diode-$VERSION.tgz"
            echo "~~~"
            echo ""
            echo "Installs diode_send and diode_receive and the matching /etc/rc.d scripts."
            echo "Enable them with:"
            echo ""
            echo "~~~"
            echo "rcctl enable diode_send"
            echo "rcctl enable diode_receive"
            echo "~~~"
            echo ""
            echo "and then edit the flags (directory, target subnet/port) to fit your setup."
            echo ""
            echo "## Alternative: bare binaries (OpenBSD arm64)"
            echo ""
            echo "If you prefer not to use pkg_add, the release also ships the two native binaries:"
            echo ""
            echo "~~~"
            echo "curl -LO https://github.com/${{ github.repository }}/releases/download/$TAG/diode_send"
            echo "curl -LO https://github.com/${{ github.repository }}/releases/download/$TAG/diode_receive"
            echo "install -m 0755 diode_send    /usr/local/bin/diode_send"
            echo "install -m 0755 diode_receive /usr/local/bin/diode_receive"
            echo "~~~"
            echo ""
          } > dist/release-notes.md

          if gh release view "$TAG" --repo "${{ github.repository }}" &>/dev/null; then
            echo "Updating existing release ${TAG} (re-run)."
            gh release upload "$TAG" \
              --repo "${{ github.repository }}" \
              --clobber \
              dist/diode_send \
              dist/diode_receive \
              dist/diode-$VERSION.tgz \
              dist/diode-$VERSION.tgz.sha256 \
              dist/SHA256SUMS
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "${TAG}" \
              ${PRERELEASE} \
              --notes-file dist/release-notes.md \
              dist/diode_send \
              dist/diode_receive \
              dist/diode-$VERSION.tgz \
              dist/diode-$VERSION.tgz.sha256 \
              dist/SHA256SUMS
          fi
          gh release view "$TAG" --repo "${{ github.repository }}"
